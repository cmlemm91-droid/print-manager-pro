{% extends "base.html" %}
{% from "_macros.html" import icon with context %}

{% block content %}
<div class="card" style="max-width:560px;margin:40px auto">
  <div class="card-body" style="text-align:center;padding:44px 28px">
    <div style="width:58px;height:58px;border-radius:16px;background:var(--red-soft);color:var(--red);display:grid;place-items:center;margin:0 auto 16px">
      {{ icon('alert', 'icon-lg') }}
    </div>
    <div style="font-size:44px;font-weight:800;letter-spacing:-.04em;line-height:1">{{ code }}</div>
    <h2 style="margin:8px 0 6px;font-size:18px">{{ page_title }}</h2>
    <p class="muted small" style="max-width:360px;margin:0 auto 18px">{{ message }}</p>
    <a class="btn btn-primary" href="/">{{ icon('dashboard') }} Zum Dashboard</a>
  </div>
</div>
{% endblock %}
